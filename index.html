<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Mass Updates — end to end</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --chrome: #fbfbfc;
    --border: #e6e8eb;
    --border-soft: #f0f1f3;
    --text: #16191d;
    --text-2: #656c76;
    --text-3: #9aa1ac;
    --accent: #2563eb;
    --blue: #2563eb;
    --green: #16a34a;
    --orange: #ea580c;
    --yellow: #ca8a04;
    --red: #dc2626;
    --purple: #7c3aed;
    --cyan: #0891b2;
    --gray: #6b7280;
  }
  * { box-sizing: border-box; }
  body.exp-operator {
    --bg: #f3f6f5;
    --chrome: #f7faf8;
    --accent: #0f766e;
    --blue: #0f766e;
    --border: #d7e3df;
    --border-soft: #e8efec;
  }
  body.exp-abc {
    --bg: #f4f6fb;
    --chrome: #f7f8fc;
    --accent: #1d4ed8;
    --blue: #1d4ed8;
  }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 20px;
  }
  body.tour-on { padding-bottom: 320px; }
  .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 22px; line-height: 28px; margin: 0; font-weight: 600; }
  .head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

  .seg { display: flex; gap: 4px; padding: 3px; border-radius: 8px; background: #eceef1; }
  .seg span {
    padding: 5px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
    color: var(--text-2); border: 1px solid transparent; user-select: none;
  }
  .seg span.on { background: #fff; border-color: var(--border); color: var(--accent); font-weight: 600; }

  .pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px;
    border-radius: 999px; font-size: 12px; cursor: pointer; user-select: none;
    border: 1px solid var(--border); color: var(--text-2); background: #fff;
  }
  .dot { width: 8px; height: 8px; border-radius: 3px; display: inline-block; flex: 0 0 8px; }
  .pill.on { font-weight: 600; }

  .page { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .crumb { font-size: 12px; color: var(--text-3); margin-bottom: 6px; }

  .side {
    width: 212px; flex: 0 0 212px; border-right: 1px solid var(--border); background: var(--chrome);
    display: flex; flex-direction: column; justify-content: space-between; padding: 10px; min-height: 560px;
  }
  .org {
    display: flex; align-items: center; gap: 8px; padding: 8px;
    border: 1px solid var(--border); border-radius: 8px; background: #fff;
  }
  .org .av {
    width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff; flex: 0 0 26px;
  }
  .org .nm { font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .org .sub { font-size: 11px; color: var(--text-3); }
  .ff-logo {
    display: flex; align-items: center; gap: 8px; padding: 8px 8px 10px;
    margin-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .ff-mark {
    width: 32px; height: 32px; border-radius: 8px; flex: 0 0 32px;
    background: linear-gradient(145deg, #14b8a6 0%, #0f766e 70%);
    color: #fff; font-size: 11px; font-weight: 800; letter-spacing: -0.4px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.18);
  }
  .ff-name { font-size: 12px; font-weight: 750; color: #0f766e; line-height: 14px; }
  .ff-tag { font-size: 10px; color: #5b7a74; }
  .nav { display: flex; flex-direction: column; gap: 2px; margin-top: 12px; }
  .nav div {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px;
    font-size: 13px; color: var(--text-2); cursor: pointer;
  }
  .nav div .g { width: 14px; color: var(--text-3); }
  .nav div.on { background: color-mix(in srgb, var(--accent) 12%, #fff); color: var(--accent); font-weight: 600; }
  .nav div.on .g { color: var(--accent); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  .topbar .title { font-size: 14px; font-weight: 650; }
  .search {
    width: 250px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 7px;
    font-size: 13px; color: var(--text-3); background: #fff;
  }
  .body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  .rowbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; padding: 3px; border-radius: 8px; background: #f2f3f5; }
  .tabs span { padding: 5px 10px; border-radius: 6px; font-size: 13px; color: var(--text-2); border: 1px solid transparent; }
  .tabs span.on { background: #fff; border-color: var(--border); color: var(--text); font-weight: 600; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px;
    font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border);
    background: #fff; color: var(--text); user-select: none;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--red); border-color: #f2c8c8; }
  .btn:hover { filter: brightness(0.98); }

  .menu {
    position: absolute; top: 36px; right: 0; z-index: 20; width: 252px; padding: 6px;
    border: 1px solid var(--border); border-radius: 9px; background: #fff;
    box-shadow: 0 6px 20px rgba(16,19,26,.10);
  }
  .menu div {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px;
    font-size: 13px; cursor: pointer;
  }
  .menu div:hover { background: #f5f6f8; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
  .kpi { border: 1px solid var(--border); border-top-width: 2px; border-radius: 8px; padding: 13px 14px; background: #fff; }
  .kpi .l { font-size: 12px; color: var(--text-2); }
  .kpi .v { font-size: 24px; font-weight: 650; margin-top: 6px; }

  .filters { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .filters .left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fin { width: 186px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; color: var(--text-3); background: #fff; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 7px;
    font-size: 12px; color: var(--text-2); border: 1px dashed #d7dae0; background: #fff; cursor: pointer;
  }

  .card { border: 1px solid var(--border); border-radius: 8px; background: #fff; }
  .card.pad { padding: 14px; }
  .card .ch { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card .ch b { font-size: 13px; font-weight: 650; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 12px; font-weight: 500; color: var(--text-2);
    padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  td { font-size: 13px; padding: 10px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
  td.wrap-cell { white-space: normal; }
  tr.sel { background: #f7f9ff; }
  .link { color: var(--accent); font-weight: 600; cursor: pointer; }
  .muted { color: var(--text-2); }
  .faint { color: var(--text-3); }
  .strong { font-weight: 600; }
  .scroll { overflow-x: auto; }

  .badge {
    display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 550; white-space: nowrap; border: 1px solid currentColor;
  }
  .badge i { font-style: normal; }

  .grid2 { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); gap: 12px; }
  .grid11 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
  .quote {
    border: 1px solid var(--border); border-left-width: 3px; border-radius: 8px; padding: 12px;
    font-size: 13px; background: var(--chrome); white-space: pre-wrap; line-height: 20px;
  }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
  .kv span:first-child { color: var(--text-2); flex: 0 0 auto; }
  .kv span:last-child { text-align: right; }
  .stack { display: flex; flex-direction: column; gap: 9px; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; }
  .foot .r { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--text-2); }
  .pg { display: inline-flex; gap: 4px; }
  .pg span { border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 12px; color: var(--text-3); }
  .note { font-size: 12px; color: var(--text-3); }
  .hint { text-align: center; font-size: 12px; color: var(--text-3); padding-top: 4px; }
  .tour-launch {
    margin-left: auto; padding: 7px 13px; border: 0; border-radius: 8px; cursor: pointer;
    background: #16191d; color: #fff; font: 600 13px/18px inherit; box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .tour-shade { position: fixed; inset: 0; z-index: 90; background: rgba(15,23,42,.18); pointer-events: none; }
  .tour-target {
    position: relative !important; z-index: 92 !important; border-radius: 9px;
    box-shadow: 0 0 0 4px #fff, 0 0 0 7px #60a5fa, 0 14px 40px rgba(0,0,0,.18) !important;
  }
  .tour-panel {
    position: fixed; z-index: 94; left: 50%; bottom: 16px; transform: translateX(-50%);
    width: min(780px, calc(100vw - 32px)); max-height: min(56vh, 520px);
    border-radius: 14px; background: #fff; box-shadow: 0 18px 55px rgba(0,0,0,.22);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .tour-progress { height: 4px; background: #e5e7eb; flex: 0 0 auto; }
  .tour-progress span { display: block; height: 100%; background: var(--blue); transition: width .2s ease; }
  .tour-content { padding: 16px 20px 12px; overflow-y: auto; min-height: 0; }
  .tour-kicker { color: var(--blue); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  .tour-content h2 { margin: 6px 0 8px; font-size: 18px; line-height: 24px; }
  .tour-content p { margin: 0; color: var(--text-2); font-size: 13px; line-height: 20px; }
  .tour-ai {
    display: flex; flex-direction: column; gap: 4px; margin-top: 12px; padding: 10px 11px; border-radius: 8px;
    background: #eefaf1; border: 1px solid #c8ebd1; color: #166534; font-size: 12px; line-height: 18px;
  }
  .tour-ai b { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
  .tour-vs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .tour-vs div { padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 16px; }
  .tour-vs b { display: block; margin-bottom: 3px; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; }
  .tour-vs .drop { background: #fef2f2; border: 1px solid #fecaca; color: #9f1239; }
  .tour-vs .gain { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
  .tour-be { margin-top: 12px; padding: 9px 10px; border-radius: 8px; background: #f8fafc; border: 1px solid #e2e8f0; }
  .tour-be > b { display: block; margin-bottom: 6px; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: #334155; }
  .tour-be .row { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 6px 8px; margin-top: 7px; align-items: start; }
  .tour-be .tag {
    justify-self: start; margin-top: 1px; padding: 1px 6px; border-radius: 999px; font-size: 9px; font-weight: 750;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .tour-be .tag.exist { background: #e0e7ff; color: #1e3a8a; }
  .tour-be .tag.build { background: #ffedd5; color: #9a3412; }
  .tour-be .api { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; line-height: 15px; color: #0f172a; word-break: break-all; }
  .tour-be .why { font-size: 11px; line-height: 15px; color: #475569; margin-top: 2px; }
  .tour-now { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 16px; }
  .tour-now div { padding: 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--chrome); }
  .tour-now b { display: block; margin-bottom: 3px; font-size: 12px; }
  .tour-now span { color: var(--text-2); font-size: 11px; line-height: 16px; }
  .tour-actions { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); flex: 0 0 auto; }
  .tour-actions .count { margin-right: auto; color: var(--text-3); font-size: 11px; }
  .tour-actions button { padding: 7px 12px; border: 1px solid var(--border); border-radius: 7px; background: #fff; cursor: pointer; }
  .tour-actions button.next { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } .grid2, .grid11 { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .tour-now { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>AI Mass Updates — end to end</h1>
    <div class="seg" id="persona"></div>
    <button class="tour-launch" onclick="startTour()">▶ Leadership walkthrough</button>
  </div>
  <div class="pills" id="cases"></div>
  <div class="pills" id="screens"></div>
  <div id="app"></div>
  <div class="hint">Click through: pick from the <b>pre-defined mass update list</b> in <b>New Mass update</b>, or switch persona to see the ABC side of the same request.</div>
</div>
<div id="tour"></div>

<script>
const HUE = { gray:"var(--gray)", purple:"var(--purple)", green:"var(--green)", yellow:"var(--yellow)",
              cyan:"var(--cyan)", blue:"var(--blue)", orange:"var(--orange)", red:"var(--red)" };
const TINT = { gray:"#f3f4f6", purple:"#f5f0ff", green:"#eefaf1", yellow:"#fdf6e3", cyan:"#e9f7fb",
               blue:"#eef2ff", orange:"#fff2ea", red:"#fdeeee" };
const STATUS_HUE = {
  "In Review":"blue", "Needs Input":"orange", "Completed":"green", "Partial Success":"yellow",
  "Draft":"gray", "Eligible":"green", "Excluded":"orange", "Done":"green", "Waiting":"blue",
  "Queued":"blue", "Not started":"gray", "Skipped":"gray", "Auto-cleared":"green",
  "Awaiting approval":"orange", "AI draft":"green", "AI summary":"green", "AI grouped":"green"
};

const CASES = [
  {
    id:"cancel", playbook:"Cancel members", hue:"red", operation:"SUBSCRIPTION_CANCEL",
    dcr:"DCR-14818", club:"IRON ASYLUM GYM", clubNo:"03208",
    request:`Please mass cancel all members in Commerce using code CCC.
Thank you!  03208 IRON ASYLUM GYM

Requested due date: Aug 27, 2026 · One time · Increasing invoices: No`,
    details:[["Mass update list","Cancel members"],["Location","IRON ASYLUM GYM · 03208"],["Scope","All active members"],
             ["Cancel code","CCC"],["Effective","Aug 27, 2026"],["Invoices due","None"]],
    kpis:[{l:"Members found",v:"412",h:"gray"},{l:"Eligible",v:"389",h:"green"},
          {l:"Excluded",v:"23",h:"orange"},{l:"Invoices stopped",v:"$14,205",h:"blue"}],
    columns:["Member","Subscription","Status","Result","Reason"],
    rows:[["941951","Monthly Dues","ACTIVE","Eligible","—"],
          ["941962","Monthly Dues","FROZEN","Eligible","—"],
          ["942014","Monthly Dues","PAID_UPFRONT_OPEN","Eligible","—"],
          ["942101","Monthly Dues","PENDING_CANCELLATION","Excluded","Cancel already pending"],
          ["942130","Monthly Dues","FROZEN","Excluded","Cancel option booked"],
          ["942144","Monthly Dues","RFC","Excluded","Status not cancellable"]],
    changeId:"CHG-1180", operationNo:"MM-2026-0442", members:"389", autoCleared:false,
    queueReason:"Revenue-reducing · whole location",
    progress:[["Submitted","Done","389 items · MM-2026-0442"],["Validated","Done","Ready for approval"],
              ["ABC review","Waiting","Revenue-reducing change"],["Execution","Not started","Runs after approval"],
              ["Results","Not started","You will be notified"]],
    summary:"Cancels every active membership at IRON ASYLUM GYM 03208 with code CCC, effective 27 Aug. About $14,205 of remaining invoices stop. 23 members excluded by status rules.",
    checks:[["Scope","One location, all active members"],["Statuses","ACTIVE / FROZEN / PUF / PUFO only"],
            ["Cancel code","CCC exists at this club"],["Excluded","23 rows, reasons attached"],
            ["Requester ≠ approver","Satisfied"]],
    runPhases:[["Approved","Done","status → PENDING_EXECUTION"],["Batch","Done","389 operation items"],
               ["Billing","Done","bulk-operation → commit"],["DataTrak","Skipped","Not a DT location"]],
    resultKpis:[{l:"Cancelled",v:"381",h:"green"},{l:"Failed",v:"8",h:"red"},
                {l:"Status",v:"PARTIAL",h:"yellow"},{l:"Run time",v:"4 min",h:"gray"}],
    failures:[["942190","Billing cycle is active. Please retry transfer later."],
              ["942233","Could not find appropriate subscription"]]
  },
  {
    id:"invoice", playbook:"Zero out invoices", hue:"orange", operation:"INVOICE_ADJUSTMENT",
    dcr:"DCR-14692", club:"CRUNCH DIVISION", clubNo:"22004",
    request:`Please zero out all DUES invoices for 8/25/2026-10/31/2026.
Club 22004 CRUNCH DIVISION will be closed during that time and
do not want to bill dues invoices.

Profit centre: DUES · Consecutive invoices changed: 2`,
    details:[["Mass update list","Zero out invoices"],["Location","CRUNCH DIVISION · 22004"],["Profit centre","DUES"],
             ["Window","Aug 25 – Oct 31, 2026"],["New amount","0.00"],["Due dates","Unchanged"]],
    kpis:[{l:"Members found",v:"1,842",h:"gray"},{l:"Eligible",v:"1,769",h:"green"},
          {l:"Excluded",v:"73",h:"orange"},{l:"Dues waived",v:"$61,915",h:"blue"}],
    columns:["Member","Invoice","State","Result","Reason"],
    rows:[["310442","Dues · 25 Sep","Unpaid","Eligible","—"],
          ["310517","Dues · 25 Sep","Unpaid","Eligible","—"],
          ["310523","Dues · 25 Oct","Unpaid","Eligible","—"],
          ["310588","Dues · 25 Sep","Paid","Excluded","Needs a refund, not an adjustment"],
          ["310604","Dues · 25 Sep","Unpaid","Excluded","Adjustment already pending"],
          ["310661","—","—","Excluded","No dues invoice in window"]],
    changeId:"CHG-1177", operationNo:"MM-2026-0468", members:"1,769", autoCleared:false,
    queueReason:"Money leaves the business · $61,915",
    progress:[["Submitted","Done","1,769 items · MM-2026-0468"],["Validated","Done","Ready for approval"],
              ["ABC review","Waiting","Finance lane · $61,915"],["Execution","Not started","Runs after approval"],
              ["Results","Not started","You will be notified"]],
    summary:"Club 22004 is closed 25 Aug to 31 Oct, so dues invoices in that window go to zero for 1,769 members. About $61,915 is given up. 41 members already paid and need a refund instead.",
    checks:[["Window","Matches the stated closure dates"],["Change type","Amount only, due dates untouched"],
            ["Paid invoices","41 routed to refund, not dropped"],["Pending adjustments","28 excluded, one active allowed"],
            ["Finance","Impact snapshot shared"]],
    runPhases:[["Approved","Done","status → PENDING_EXECUTION"],["Batch","Done","1,769 operation items"],
               ["Billing","Done","invoice amounts → 0.00"],["DataTrak","Skipped","Not a DT location"]],
    resultKpis:[{l:"Adjusted",v:"1,769",h:"green"},{l:"Failed",v:"0",h:"green"},
                {l:"Status",v:"SUCCESS",h:"green"},{l:"Run time",v:"11 min",h:"gray"}],
    failures:[]
  },
  {
    id:"price", playbook:"Change price", hue:"purple", operation:"SUBSCRIPTION_PRICE_UPDATE",
    dcr:"DCR-14792", club:"BFT BLACKBURN", clubNo:"Glofox",
    request:`BFT Blackburn BPR sweep.

Bulk price raise across Glofox memberships, effective with the
next billing cycle. Existing discounts stay as they are.`,
    details:[["Mass update list","Change price"],["Location","BFT BLACKBURN · Glofox"],["Plans","All recurring memberships"],
             ["Increase","Per plan, from the audit sheet"],["Effective","Next billing cycle"],["Discounts","Preserved"]],
    kpis:[{l:"Members found",v:"1,204",h:"gray"},{l:"Eligible",v:"1,131",h:"green"},
          {l:"Excluded",v:"73",h:"orange"},{l:"Monthly increase",v:"+$9,048",h:"green"}],
    columns:["Member","Plan","Change","Result","Reason"],
    rows:[["775120","Unlimited","39.99 → 47.99","Eligible","—"],
          ["775184","Unlimited","39.99 → 47.99","Eligible","—"],
          ["775206","8 Session","29.99 → 34.99","Eligible","—"],
          ["775298","Unlimited","—","Excluded","Paid upfront, not supported"],
          ["775344","8 Session","—","Excluded","Pending cancellation"],
          ["775401","Unlimited","—","Excluded","No future invoices"]],
    changeId:"CHG-1178", operationNo:"MM-2026-0463", members:"1,131", autoCleared:false,
    queueReason:"Price increase · finance lane",
    progress:[["Submitted","Done","1,131 items · MM-2026-0463"],["Validated","Done","Ready for approval"],
              ["ABC review","Waiting","Price change · finance lane"],["Execution","Not started","Runs after approval"],
              ["Results","Not started","You will be notified"]],
    summary:"Bulk price raise for 1,131 Glofox memberships at BFT Blackburn, adding about $9,048 monthly recurring. Takes effect next billing cycle; no current invoice changes. Discounts preserved.",
    checks:[["Effective date","Next cycle, nothing retroactive"],["Subtypes","Paid upfront excluded per guide"],

      <span class="faint" style="font-size:12px">${c.dcr}</span>
    </div>
    <div style="display:flex;gap:8px"><span class="btn" onclick="go('op','list')">Back</span><span class="btn">Withdraw</span></div>
  </div>
  ${kpis([{l:"Members affected",v:c.members,h:"blue"},{l:c.kpis[3].l,v:c.kpis[3].v,h:"purple"},
          {l:"Operation",v:c.operationNo,h:"gray"},
          {l:c.autoCleared?"Time to complete":"Waiting on ABC",v:c.autoCleared?"38 min":"12 min",h:c.autoCleared?"green":"orange"}])}
  <div class="grid2">
    <div class="card"><div class="ch"><b>Progress</b></div><table><tbody>
      ${c.progress.map(r=>`<tr><td style="width:130px" class="strong">${esc(r[0])}</td>
      <td style="width:110px">${badge(r[1])}</td><td class="muted">${esc(r[2])}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="card pad" style="border-top:2px solid var(--cyan)">
      <b style="font-size:13px">Actions</b>
      <div class="stack" style="margin-top:10px">
        <span class="chip">Withdraw mass update</span><span class="chip">New mass update for the excluded</span><span class="chip">Export member list</span>
      </div>
      <div class="note" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft)">Approval and execution stay with ABC.</div>
    </div>
  </div>`;
}

function abcQueue() {
  const c = cur();
  const queued = CASES.filter(x=>!x.autoCleared), cleared = CASES.filter(x=>x.autoCleared);
  return `
  <div class="rowbar">
    <div class="tabs"><span class="on">Awaiting approval</span><span>Auto-cleared</span><span>All operations</span></div>
    <span class="chip">⇅ View</span>
  </div>
  ${kpis([{l:"Awaiting approval",v:String(queued.length),h:"orange"},{l:"Auto-cleared today",v:String(cleared.length),h:"green"},
          {l:"Oldest in queue",v:"12 min",h:"blue"},{l:"Members this week",v:"12,442",h:"purple"}])}
  ${filters("Filter operations...",["Mass update list","Risk","Location"])}
  <div class="card"><div class="scroll"><table>
    <thead><tr><th style="width:34px"><input type="checkbox" disabled></th>
    ${["Operation","Mass update list","Location","Members","Why it is here","Request"].map(h=>`<th>${h}</th>`).join("")}
    <th style="width:34px"></th></tr></thead>
    <tbody>${queued.map(x=>`<tr class="${x.id===c.id?"sel":""}">
      <td><input type="checkbox" disabled></td>
      <td class="link" onclick="openReview('${x.id}')">${x.operationNo}</td>
      <td>${dot(x.hue)} ${esc(x.playbook)}</td>
      <td class="muted">${esc(x.club)} · ${esc(x.clubNo)}</td>
      <td class="strong">${x.members}</td>
      <td class="muted">${esc(x.queueReason)}</td>
      <td class="faint">${x.dcr}</td><td class="faint">⋯</td></tr>`).join("")}
    </tbody></table></div>
    <div style="padding:10px 12px 0"><span class="note">Cleared automatically — visible, not queued</span></div>
    <table><tbody>${cleared.map(x=>`<tr>
      <td style="width:34px"></td>
      <td class="link" onclick="openReview('${x.id}')">${x.operationNo}</td>
      <td>${dot(x.hue)} ${esc(x.playbook)}</td>
      <td class="muted">${esc(x.club)} · ${esc(x.clubNo)}</td>
      <td class="strong">${x.members}</td>
      <td>${badge("Auto-cleared")}</td>
      <td class="faint">${x.dcr}</td><td class="faint">⋯</td></tr>`).join("")}</tbody></table>
    ${foot(0, CASES.length)}</div>`;
}

function abcReview() {
  const c = cur();
  const actions = c.autoCleared
    ? `<span class="btn" onclick="go('abc','results')">View results</span>`
    : `<span class="btn">Send back</span><span class="btn danger">Reject</span>
       <span class="btn primary" onclick="go('abc','results')">Approve and run</span>`;
  return `
  <div class="rowbar">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <b style="font-size:15px">${c.operationNo}</b>
      ${badge(c.autoCleared ? "Auto-cleared" : "Awaiting approval")}
      <span class="muted" style="font-size:12px">${dot(c.hue)} ${esc(c.operation)}</span>
      <span class="faint" style="font-size:12px">${c.changeId} · ${c.dcr}</span>
    </div>
    <div style="display:flex;gap:8px"><span class="btn" onclick="go('abc','queue')">Back</span>${actions}</div>
  </div>
  ${kpis(c.kpis)}
  <div class="grid2">
    <div class="card pad" style="border-top:2px solid var(--blue)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <b style="font-size:13px">What you are approving</b>${badge("AI summary")}
      </div>
      <div style="font-size:13px;line-height:20px">${esc(c.summary)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft)">
        <span class="chip">View all ${c.members} items</span><span class="chip">View exclusions</span><span class="chip">Open ${c.dcr}</span>
      </div>
    </div>
    <div class="card"><div class="ch"><b>Checks</b></div><table><tbody>
      ${c.checks.map(r=>`<tr><td style="width:150px" class="muted">${esc(r[0])}</td><td class="wrap-cell">${esc(r[1])}</td></tr>`).join("")}
    </tbody></table></div>
  </div>
  <div class="card"><div class="ch"><b>Sample of the items</b></div><div class="scroll"><table>
    <thead><tr>${c.columns.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${c.rows.map(r=>`<tr><td class="strong">${esc(r[0])}</td><td>${esc(r[1])}</td>
      <td class="muted">${esc(r[2])}</td><td>${badge(r[3])}</td><td class="muted">${esc(r[4])}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}

function abcResults() {
  const c = cur();
  const exceptions = c.failures.length
    ? `<table><tbody>${c.failures.map(r=>`<tr><td style="width:90px" class="strong">${esc(r[0])}</td>
        <td class="muted wrap-cell">${esc(r[1])}</td></tr>`).join("")}
        <tr><td class="faint" colspan="2">Retry drafted for the operator, re-validated first.</td></tr></tbody></table>`
    : `<div style="padding:14px;font-size:13px;color:var(--green)">Every row succeeded. Nothing to work.</div>`;
  return `
  <div class="rowbar">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <b style="font-size:15px">${c.operationNo}</b>
      ${badge(c.failures.length ? "Partial Success" : "Completed")}
      <span class="muted" style="font-size:12px">${dot(c.hue)} ${esc(c.playbook)}</span>
    </div>
    <div style="display:flex;gap:8px"><span class="btn" onclick="go('abc','queue')">Back to queue</span><span class="btn">Export results</span></div>
  </div>
  ${kpis(c.resultKpis)}
  <div class="grid11">
    <div class="card"><div class="ch"><b>Execution</b></div><table><tbody>
      ${c.runPhases.map(r=>`<tr><td style="width:120px" class="strong">${esc(r[0])}</td>
      <td style="width:90px">${badge(r[1])}</td><td class="muted">${esc(r[2])}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="card"><div class="ch"><b>Exceptions</b>${c.failures.length?badge("AI grouped"):""}</div>${exceptions}</div>
  </div>`;
}

function render() {
  const isOp = state.persona === "operator";
  document.body.classList.toggle("exp-operator", isOp);
  document.body.classList.toggle("exp-abc", !isOp);
  document.body.classList.toggle("tour-on", tourIndex >= 0);
  document.getElementById("persona").innerHTML =
    [["operator","Operator"],["abc","ABC Billing Ops"]].map(([id,l]) =>
      `<span id="persona-${id}" class="${state.persona===id?"on":""}" onclick="setPersona('${id}')">${l}</span>`).join("");
  document.getElementById("cases").innerHTML = CASES.map(c => {
    const on = c.id === state.caseId;
    return `<span class="pill ${on?"on":""}" style="${on?`border-color:${HUE[c.hue]};color:${HUE[c.hue]};background:${TINT[c.hue]}`:""}"
      onclick="setCase('${c.id}')">${dot(c.hue)}${esc(c.playbook)} · ${c.dcr}</span>`;
  }).join("");
  const screens = isOp ? OP_SCREENS : ABC_SCREENS, active = isOp ? state.op : state.abc;
  document.getElementById("screens").innerHTML = screens.map(([id,l]) => {
    const on = id === active;
    return `<span class="pill ${on?"on":""}" style="${on?"border-color:var(--accent);color:var(--accent);background:#eef2ff":""}"
      onclick="go('${isOp?"op":"abc"}','${id}')">${l}</span>`;
  }).join("");
  let inner;
  if (isOp) inner = state.op==="list"?operatorList():state.op==="new"?operatorDescribe():state.op==="preview"?operatorPreview():operatorTrack();
  else inner = state.abc==="queue"?abcQueue():state.abc==="review"?abcReview():abcResults();
  document.getElementById("app").innerHTML = shell(inner);
  if (tourIndex >= 0) setTimeout(renderTour, 0);
}
function setPersona(p){ state.persona=p; state.menu=false; render(); }
function setCase(id){ state.caseId=id; state.menu=false; render(); }
function go(side,screen){ state[side]=screen; state.menu=false; render(); }
function toggleMenu(){ state.menu=!state.menu; render(); }
function pickPlaybook(id){ state.caseId=id; state.menu=false; state.op="new"; render(); }
function openChange(id){ state.caseId=id; state.op="track"; render(); }
function openReview(id){ state.caseId=id; state.abc="review"; render(); }
function applyTourState(step) {
  Object.assign(state, step.state || {});
  state.caseId = "cancel";
  if (!("menu" in (step.state || {}))) state.menu = false;
}
function startTour(){ tourIndex=0; applyTourState(TOUR[0]); render(); }
function moveTour(n){
  const next = tourIndex + n;
  if (next < 0) return;
  if (next >= TOUR.length){ endTour(); return; }
  tourIndex=next; applyTourState(TOUR[tourIndex]); render();
}
function endTour(){
  document.querySelectorAll(".tour-target").forEach(el=>el.classList.remove("tour-target"));
  tourIndex=-1; document.body.classList.remove("tour-on"); document.getElementById("tour").innerHTML="";
}
function tourKicker(step){
  if (tourIndex===0) return "AI Mass Updates vision";
  if (tourIndex===TOUR.length-1) return "The opportunity";
  return (step.state && step.state.persona==="abc") ? "Billing exp walkthrough" : "Operator exp walkthrough";
}
function renderTour(){
  if (tourIndex < 0) return;
  document.querySelectorAll(".tour-target").forEach(el=>el.classList.remove("tour-target"));
  const step=TOUR[tourIndex], target=step.selector ? document.querySelector(step.selector) : null;
  const personaTab=document.getElementById(state.persona==="abc"?"persona-abc":"persona-operator");
  if (personaTab) personaTab.classList.add("tour-target");
  if (target) {
    target.classList.add("tour-target");
    target.scrollIntoView({behavior:"smooth",block:"center"});
  }
  const boxes = step.boxes ? `<div class="tour-now">${step.boxes.map(x=>`<div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join("")}</div>` : "";
  const vs = step.vs ? `<div class="tour-vs"><div class="drop"><b>Eliminates</b>${esc(step.vs.drop)}</div><div class="gain"><b>Adds</b>${esc(step.vs.add)}</div></div>` : "";
  const be = step.be ? `<div class="tour-be"><b>APIs this step uses</b>${step.be.map(([k,api,why])=>`<div class="row"><span class="tag ${k}">${k==="exist"?"Exists":"Build"}</span><div><div class="api">${esc(api)}</div>${why?`<div class="why">${esc(why)}</div>`:""}</div></div>`).join("")}</div>` : "";
  const ai = step.ai ? `<div class="tour-ai"><b>Where AI is used</b><span>${esc(step.ai)}</span></div>` : "";
  document.getElementById("tour").innerHTML = `<div class="tour-shade"></div>
    <section class="tour-panel">
      <div class="tour-progress"><span style="width:${((tourIndex+1)/TOUR.length)*100}%"></span></div>
      <div class="tour-content"><div class="tour-kicker">${tourKicker(step)}</div>
        <h2>${esc(step.title)}</h2><p>${esc(step.text)}</p>${boxes}${vs}${ai}${be}</div>
      <div class="tour-actions"><span class="count">${tourIndex+1} of ${TOUR.length}</span>
        <button onclick="endTour()">Exit</button>${tourIndex?`<button onclick="moveTour(-1)">Back</button>`:""}
        <button class="next" onclick="moveTour(1)">${tourIndex===TOUR.length-1?"Finish":"Next"}</button></div>
    </section>`;
}
render();
</script>
</body>
</html>
