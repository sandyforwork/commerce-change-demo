<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Commerce Change — end to end</title>
</head>
<body>
<p>Loading demo…</p>
<script>
Promise.all(["part1.txt","part2.txt","part3.txt","part4.txt"].map(f => fetch(f).then(r => {
  if (!r.ok) throw new Error(f);
  return r.text();
}))).then(parts => {
  document.open();
  document.write(parts.join(""));
  document.close();
}).catch(err => {
  document.body.textContent = "Could not load the demo: " + err;
});
</script>
</body>
</html>
