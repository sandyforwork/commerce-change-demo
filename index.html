<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Commerce Change — end to end</title>
</head>
<body>
<p style="font-family:sans-serif;padding:24px;color:#656c76">Loading Commerce Change…</p>
<script>
Promise.all([1,2,3].map(function(i){
  return fetch('b64-' + i + '.txt').then(function(r){
    if (!r.ok) throw new Error('Missing payload ' + i);
    return r.text();
  });
})).then(async function(parts){
  var b64 = parts.join('').replace(/\s+/g,'');
  var bin = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
  var stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  var html = await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
}).catch(function(e){
  document.body.textContent = 'Could not load the demo: ' + e;
});
</script>
</body>
</html>
